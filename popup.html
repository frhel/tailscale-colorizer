<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailscale Tag Colorizer</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Safety net — popup will always have visible height */
    html, body { display:block; min-height:320px; margin:0; padding:0; }
  </style>
</head>
<body>
  <header>
    <h1>Tailscale Tag Colorizer</h1>
    <label class="toggle">
      <input type="checkbox" id="enabledToggle" checked>
      <span class="toggle-slider"></span>
      <span class="toggle-label" id="toggleLabel">Enabled</span>
    </label>
  </header>

  <section class="mode-section">
    <label for="highlightMode">Mode:</label>
    <select id="highlightMode">
      <option value="border-left">Border (left)</option>
      <option value="bg-tint">Background tint</option>
      <option value="both">Both</option>
      <option value="pill-only">Pill only</option>
    </select>
  </section>

  <section class="mode-section">
    <label for="bgOpacity">Tint opacity:</label>
    <div class="slider-group">
      <input type="range" id="bgOpacity" min="3" max="20" value="10" step="1">
      <span id="opacityValue">10%</span>
    </div>
  </section>

  <section class="mode-section">
    <label class="toggle">
      <input type="checkbox" id="sortToggle">
      <span class="toggle-slider"></span>
      <span class="toggle-label" id="sortLabel">Sort by tag</span>
    </label>
  </section>

  <section class="rules-section">
    <div class="rules-header">
      <h2>Tags</h2>
      <button id="addRuleBtn" class="btn btn-sm">+ Add</button>
    </div>
    <div id="rulesList" class="rules-list"></div>
    <div id="emptyState" class="empty-state">
      No tags discovered yet.<br>Open the Tailscale Machines page and click Scan now.
    </div>
  </section>

  <footer>
    <button id="scanBtn" class="btn btn-primary">Scan now</button>
    <button id="resetBtn" class="btn btn-secondary">Clear all rules</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
